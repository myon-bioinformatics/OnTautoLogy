<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI搭載botの関係候補 | OnTautoLogy</title>
<style>
body {font: 1rem/1.7 system-ui,sans-serif; max-width: 70rem; margin: auto; padding: 1rem}
figure {margin: 1rem 0; overflow-x: auto}
figure svg {min-width: 48rem}
</style>
</head>
<body>
<nav><a href="../">OnTautoLogy</a></nav>
<h1>AI搭載botの関係候補</h1>
<p>第二弾の概念テスト。AI搭載botを登録語から一度外し、手掛かりを順に渡す例です。</p>
<ol start="0">
<li>名前だけでは関係を保留します。</li>
<li>「用途:自動応答」を加えると、スクリプト型botと用途を共有する候補が立ちます。</li>
<li>さらに「入力から出力を推論」を加えると、AIシステムの応用という候補も立ちます。</li>
</ol>
<p>どの段階でも同義かどうかは未確定です。図の各仮説から、対象概念・関係の種類・根拠をたどれます。</p>
<figure aria-label="AI搭載botの関係候補と根拠" id="graph"></figure>
<p><a href="bot.ttl" download>知識グラフを取得（Turtle）</a> · <a href="bot.mmd">Mermaidソース</a></p>
<script type="module">
const figure = document.getElementById('graph');
try {
  const {default: mermaid} = await import('https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.esm.min.mjs');
  mermaid.initialize({startOnLoad: false, securityLevel: 'strict'});
  const response = await fetch('bot.mmd');
  if (!response.ok) throw new Error('diagram unavailable');
  const {svg} = await mermaid.render('bot-relations', await response.text());
  figure.innerHTML = svg;
} catch {
  figure.textContent = '図を読み込めませんでした。関係候補は上の一覧で確認できます。';
}
</script>
</body>
</html>
