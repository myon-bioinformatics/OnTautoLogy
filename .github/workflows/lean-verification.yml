name: Lean verification

on:
  pull_request:
    paths:
      - "formal/**"
      - "ontautology.py"
      - "tools/tautology.py"
      - "tests/test_formal_bridge.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "ontautology.py"
      - "tools/tautology.py"
      - "tests/test_formal_bridge.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  truth-tables:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-lean-verify.yml@27c46411c0a07d9b4d0f1ad5751ed1bb9e869b5c
    with:
      project-directory: formal
      proof: TruthTableSoundness.lean
      theorems: |
        OnTautoLogy.assignments_complete
        OnTautoLogy.difference_replays
        OnTautoLogy.equivalence_iff
        OnTautoLogy.counterexample_replays
        OnTautoLogy.no_counterexample_iff
        OnTautoLogy.consistent_iff
        OnTautoLogy.entailed_iff
        OnTautoLogy.inconsistent_iff
