name: CI
# ⏱ Pull requests get the quick gate: one Python (the newest), fail-fast, superseded runs cancelled, and nothing for
# docs-only changes. main runs everything (both Pythons). A push to a PR branch no longer runs a second copy.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@27c46411c0a07d9b4d0f1ad5751ed1bb9e869b5c

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.15"]' || '["3.11", "3.15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Verify Node major
        shell: bash
        run: |
          node_major=$(node -p "process.versions.node.split('.')[0]")
          if [[ "$node_major" -lt 26 ]]; then
            echo "node ${node_major} is older than 26" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Exercise installed shared API from outside the checkout
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          cd "$RUNNER_TEMP"
          uv venv consumer
          uv pip install --python consumer/bin/python --no-deps wheels/*.whl
          consumer/bin/python -I "$GITHUB_WORKSPACE/examples/shared_taxonomy.py"
      - run: uv run --no-project python -S -m unittest discover -s tests -v
      - run: uv run --no-project python -S gh_audit/gh_audit.py audit examples/audit-20261114.json -o /tmp/graph.json
      - run: uv run --no-project python -S gh_audit/gh_audit.py check /tmp/graph.json
      # plan exits 2 when something is blocked; that is an answer about the snapshot, not a failure of the tool
      - run: uv run --no-project python -S gh_audit/gh_audit.py plan /tmp/graph.json || [ $? -eq 2 ]

  # Outside modules for trying an idea first: Redis answers the same questions; here a skip is a failure.
  redis:
    needs: changes
    # ⏱ the heavy lanes run on main only; nothing for docs-only changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          python-version: '3.15'
      - run: uv run --no-project --with redis python -m unittest discover -s tests -p test_tools.py -k RedisCrossCheck -v

  graph-exchange:
    needs: changes
    # ⏱ the heavy lanes run on main only; nothing for docs-only changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5-community
        ports: ['7687:7687']
        env:
          NEO4J_AUTH: neo4j/otl-ci-local
      arcade:
        image: arcadedata/arcadedb:26.11.1
        ports: ['2480:2480']
        env:
          ARCADEDB_SETTINGS: -Darcadedb.server.rootPassword=otl-ci-local -Darcadedb.server.defaultDatabases=otl[]
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: otl-ci-local
      ARCADE_COMMAND_URL: http://localhost:2480/api/v1/command/otl
      ARCADE_CREDENTIALS: root:otl-ci-local
      OTL_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          python-version: '3.11'
      - run: uv sync --extra exchange
      - name: Wait for both query engines
        run: |
          for attempt in {1..40}; do
            if uv run python -c 'from ontautology_shared._onto.ontology import transfer, arcade; transfer("neo4j", "ready"); arcade("sql", "select 1", {})'; then exit 0; fi
            sleep 3
          done
          exit 1
      - run: uv run python -m unittest discover -s tests -p test_exchange.py -v
        env:
          OTL_EXPORT_DIR: graph-exports
      - name: Save both database round trips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-exports
          path: |
            graph-exports/*.ttl
            graph-exports/*.json
          if-no-files-found: error
      - name: Show the exported graph
        run: uv run python tools/knowledgegraph.py graph-exports/neo4j-arcade-neo4j.ttl >> "$GITHUB_STEP_SUMMARY"
