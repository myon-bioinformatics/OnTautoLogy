name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: latest
          python-version: ${{ matrix.python }}
      - run: uv run --no-project python -S -m unittest discover -s tests -v
      - run: uv run --no-project python -S ontautology.py audit examples/audit-20261114.json -o /tmp/graph.json
      - run: uv run --no-project python -S ontautology.py check /tmp/graph.json
      # plan exits 2 when something is blocked; that is an answer about the snapshot, not a failure of the tool
      - run: uv run --no-project python -S ontautology.py plan /tmp/graph.json || [ $? -eq 2 ]
