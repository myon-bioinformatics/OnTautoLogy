name: OTL relation profiles
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  examples:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/TaxOntOy
          ref: c80f39cd9a5359403fdfce0fec9be4605594c8eb # 📌 TOO_COMMIT: the sibling-format snapshot
          path: too
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/TopOntoLogy
          ref: d61c3fc6bc813966357dfc8f614217aaf50d2c15 # 📌 TOL_COMMIT: the sibling-format snapshot
          path: tol
          persist-credentials: false
      - run: |
          python3 -S examples/wave_relations.py too/otl-relations.json > report.json
          python3 -S examples/check_wave_report.py report.json
        env:
          ONTO_ROOT: ontautology_shared/_onto
          OTL_ROOT: .
