name: OTL relation profiles
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/TaxOntOy
          ref: 1d5ad6c1295156c1325bed893e4dd3c8c3f8b1e5
          path: too
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/TopOntoLogy
          ref: e334b1aff45ff9fb02732c2b20169a8ef45816a9
          path: tol
          persist-credentials: false
      - run: |
          python3 -S examples/wave_relations.py too/otl-relations.json > report.json
          python3 -S examples/check_wave_report.py report.json
        env:
          PYTHONPATH: tol:ontautology_shared/_onto
