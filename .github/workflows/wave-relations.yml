name: OTL relation profiles
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/TaxOntOy
          ref: 78ed91aee522e9a7305e2bf964dab9be2bd3fff0 # main
          path: too
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/TopOntoLogy
          ref: 7bd70a45585e94522a1e87c362ee35b1316118d9 # main
          path: tol
          persist-credentials: false
      - run: |
          python3 -S examples/wave_relations.py too/otl-relations.json > report.json
          python3 -S examples/check_wave_report.py report.json
        env:
          PYTHONPATH: tol:ontautology_shared/_onto
