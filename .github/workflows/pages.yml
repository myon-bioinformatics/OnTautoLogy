name: Pages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "docs/guide.features.json"
      - "docs/pages.gif"
      - ".github/workflows/pages.yml"
      - "ontautology.py"
      - "ontautology_graphs.py"
      - "gh_audit/gh_audit.py"
      - "tools/tautology.py"
      - "tools/knowledgegraph.py"
      - "ontautology_shared/**"
      - "vendor/cli_args.py"
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@1cd621c8a46d18611a9135bdc8a0e9d46013d58d
    with:
      artifact_path: site
      # 📘 site/index.html is the usage guide (🎞 GIF demo / 🧭 examples / 📚 feature reference), rendered from data by the pinned renderer.
      guide_page: docs/guide.page.json
      guide_features_config: docs/guide.features.json
      guide_assets: docs/pages.gif=demos/pages.gif
      guide_brand: OnTautoLogy   # ♻️ icon and favicon from CaChereCyCle (OnTautoLogy.icon / OnTautoLogy.favicon)
      build: |
        set -eu
        python3 -m venv "$RUNNER_TEMP/otl-pages"
        "$RUNNER_TEMP/otl-pages/bin/pip" install rdflib==7.6.0
        "$RUNNER_TEMP/otl-pages/bin/python" scripts/atlas.py site/atlas --renderer-output site/shared/mermaid.js
        python -S examples/sibling_format.py page examples/wave-profiles.json site/relations
        python -S scripts/page_sizes.py
        node --check site/third-design/app.js
        node --check site/third-design/review-records.js
        node --input-type=module --check < site/atlas/view.js
        node --input-type=module --check < site/third-design/shared/scroll.js
