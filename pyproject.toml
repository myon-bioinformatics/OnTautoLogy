[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontautology"
version = "0.1.0"
description = "Cross-repository knowledge graph: core walks and a time-scoped PR audit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
exchange = ["rdflib>=7", "neo4j>=5"]

[project.scripts]
ontautology = "ontautology:main"

[tool.setuptools]
py-modules = ["ontautology"]
packages = ["ontautology_shared", "ontautology_shared._onto"]

[tool.setuptools.package-data]
"ontautology_shared._onto" = ["LICENSE"]
